<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes appear { to { opacity: 1; } }
      @keyframes blink { 0%,49%{opacity:1}50%,100%{opacity:0} }

      .base { font-family: 'Courier New', Courier, monospace; font-size: 13px; }
      .cmd  { fill: #7ee787; }
      .out  { fill: #e6edf3; }
      .dim  { fill: #8b949e; }
      .net  { fill: #79c0ff; }
      .bld  { fill: #ffa657; }

      .l1  { opacity:0; animation: appear .01s  .30s forwards; }
      .l2  { opacity:0; animation: appear .01s 1.00s forwards; }
      .l3  { opacity:0; animation: appear .01s 1.80s forwards; }
      .l4  { opacity:0; animation: appear .01s 2.50s forwards; }
      .l5  { opacity:0; animation: appear .01s 3.00s forwards; }
      .l6  { opacity:0; animation: appear .01s 3.50s forwards; }
      .l7  { opacity:0; animation: appear .01s 4.30s forwards; }
      .l8  { opacity:0; animation: appear .01s 5.00s forwards; }
      .l9  { opacity:0; animation: appear .01s 5.50s forwards; }
      .l10 { opacity:0; animation: appear .01s 6.00s forwards; }
      .l11 { opacity:0; animation: appear .01s 6.80s forwards; }
      .l12 { opacity:0; animation: appear .01s 7.40s forwards; }
      .l13 { opacity:0; animation: appear .01s 7.70s forwards; }
      .l14 { opacity:0; animation: appear .01s 8.40s forwards; }
      .cur { opacity:0; animation: blink    1s  8.50s infinite; }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal bg -->
  <rect width="800" height="460" rx="12" ry="12" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="800" height="40" rx="12" ry="12" fill="#161b22"/>
  <rect y="28" width="800" height="12" fill="#161b22"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>

  <!-- Window title -->
  <text x="400" y="26" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="12" fill="#8b949e">
    reymartlouie — zsh
  </text>

  <!-- Subtle border -->
  <rect width="799" height="459" x=".5" y=".5" rx="11.5" ry="11.5"
        fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- ── Content ── -->

  <!-- whoami -->
  <text x="28" y="70"  class="base l1 cmd" filter="url(#glow)">$ whoami</text>
  <text x="28" y="92"  class="base l2 out">reymartlouie</text>

  <!-- identity -->
  <text x="28" y="136" class="base l3 cmd" filter="url(#glow)">$ cat ./identity.txt</text>
  <text x="28" y="158" class="base l4 dim">  Computer Engineer. Linux native.</text>
  <text x="28" y="180" class="base l5 dim">  Network infrastructure is the career.</text>
  <text x="28" y="202" class="base l6 dim">  Systems &amp; web products are the craft.</text>

  <!-- ping -->
  <text x="28" y="246" class="base l7 cmd" filter="url(#glow)">$ ping networking.local</text>
  <text x="28" y="268" class="base l8 dim">  PING networking.local: 56 bytes of data.</text>
  <text x="28" y="290" class="base l9 net">  64 bytes: TCP/IP · DNS · VLANs · Routing</text>
  <text x="28" y="312" class="base l10 net">  64 bytes: SSH · Linux · Subnetting · Diagnostics</text>

  <!-- ls builds -->
  <text x="28" y="356" class="base l11 cmd" filter="url(#glow)">$ ls ./builds/shipped/</text>
  <text x="28" y="378" class="base l12">
    <tspan class="bld">FitnessMadness/</tspan><tspan dx="16" class="bld">FireSafe/</tspan>
  </text>
  <text x="28" y="400" class="base l13">
    <tspan class="bld">GraceyLogistics/</tspan><tspan dx="16" class="bld">Brewed/</tspan>
  </text>

  <!-- prompt + cursor -->
  <text x="28" y="440" class="base l14 cmd" filter="url(#glow)">$ </text>
  <rect x="44" y="427" width="8" height="16" fill="#7ee787" class="cur"/>
</svg>
