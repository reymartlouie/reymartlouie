<svg width="800" height="900" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes appear { to { opacity: 1; } }
      @keyframes blink { 0%,49%{opacity:1}50%,100%{opacity:0} }

      .base { font-family: 'Courier New', Courier, monospace; font-size: 13px; }
      .cmd  { fill: #7ee787; }
      .out  { fill: #e6edf3; }
      .dim  { fill: #8b949e; }
      .net  { fill: #79c0ff; }
      .dev  { fill: #e3b341; }
      .bld  { fill: #ffa657; }
      .ok   { fill: #7ee787; }

      .l1  { opacity:0; animation: appear .01s  0.30s forwards; }
      .l2  { opacity:0; animation: appear .01s  0.90s forwards; }
      .l3  { opacity:0; animation: appear .01s  1.80s forwards; }
      .l4  { opacity:0; animation: appear .01s  2.40s forwards; }
      .l5  { opacity:0; animation: appear .01s  2.80s forwards; }
      .l6  { opacity:0; animation: appear .01s  3.30s forwards; }
      .l7  { opacity:0; animation: appear .01s  3.70s forwards; }
      .l8  { opacity:0; animation: appear .01s  4.20s forwards; }
      .l9  { opacity:0; animation: appear .01s  5.20s forwards; }
      .l10 { opacity:0; animation: appear .01s  5.80s forwards; }
      .l11 { opacity:0; animation: appear .01s  6.20s forwards; }
      .l12 { opacity:0; animation: appear .01s  6.60s forwards; }
      .l13 { opacity:0; animation: appear .01s  7.00s forwards; }
      .l14 { opacity:0; animation: appear .01s  8.00s forwards; }
      .l15 { opacity:0; animation: appear .01s  8.60s forwards; }
      .l16 { opacity:0; animation: appear .01s  9.00s forwards; }
      .l17 { opacity:0; animation: appear .01s  9.40s forwards; }
      .l18 { opacity:0; animation: appear .01s  9.80s forwards; }
      .l19 { opacity:0; animation: appear .01s 10.20s forwards; }
      .l20 { opacity:0; animation: appear .01s 11.20s forwards; }
      .l21 { opacity:0; animation: appear .01s 11.80s forwards; }
      .l22 { opacity:0; animation: appear .01s 12.20s forwards; }
      .l23 { opacity:0; animation: appear .01s 13.20s forwards; }
      .l24 { opacity:0; animation: appear .01s 13.80s forwards; }
      .l25 { opacity:0; animation: appear .01s 14.60s forwards; }
      .cur { opacity:0; animation: blink    1s  14.70s infinite; }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal bg -->
  <rect width="800" height="900" rx="12" ry="12" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="800" height="40" rx="12" ry="12" fill="#161b22"/>
  <rect y="28" width="800" height="12" fill="#161b22"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>

  <!-- Window title -->
  <text x="400" y="26" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="12" fill="#8b949e">
    reymartlouie — zsh
  </text>

  <!-- Subtle border -->
  <rect width="799" height="899" x=".5" y=".5" rx="11.5" ry="11.5"
        fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- ── whoami ── -->
  <text x="28" y="70"  class="base l1 cmd" filter="url(#glow)">$ whoami</text>
  <text x="28" y="92"  class="base l2 out">reymartlouie</text>

  <!-- ── about ── -->
  <text x="28" y="136" class="base l3 cmd" filter="url(#glow)">$ cat ./about.txt</text>

  <text x="28" y="180" class="base l4 dim">  Computer engineer with a networking foundation.</text>
  <text x="28" y="202" class="base l5 dim">  Routing, protocols, and infrastructure — that's the career.</text>

  <text x="28" y="246" class="base l6 dim">  On the side: management systems, internal tools, landing pages.</text>
  <text x="28" y="268" class="base l7 dim">  UI/UX that makes sense to the people using them.</text>

  <text x="28" y="312" class="base l8 dim">  Linux is home. The terminal is the workspace.</text>

  <!-- ── career ── -->
  <text x="28" y="356" class="base l9 cmd" filter="url(#glow)">$ ./career --networking</text>

  <text x="28" y="400" class="base l10">
    <tspan class="net">  PROTOCOLS</tspan><tspan x="184" class="dim">TCP/IP · DNS · DHCP · HTTP/S · ICMP</tspan>
  </text>
  <text x="28" y="422" class="base l11">
    <tspan class="net">  ROUTING</tspan><tspan x="184" class="dim">VLANs · Subnetting · Static &amp; Dynamic Routing</tspan>
  </text>
  <text x="28" y="444" class="base l12">
    <tspan class="net">  INFRASTRUCTURE</tspan><tspan x="184" class="dim">Linux · SSH · Bash/Zsh · Network Diagnostics</tspan>
  </text>
  <text x="28" y="466" class="base l13">
    <tspan class="net">  HARDWARE</tspan><tspan x="184" class="dim">Raspberry Pi · Embedded Systems · IoT Devices</tspan>
  </text>

  <!-- ── builds ── -->
  <text x="28" y="510" class="base l14 cmd" filter="url(#glow)">$ ./builds --dev</text>

  <text x="28" y="554" class="base l15">
    <tspan class="dev">  FRONTEND</tspan><tspan x="184" class="dim">React · Next.js · TypeScript · Tailwind CSS · Vite</tspan>
  </text>
  <text x="28" y="576" class="base l16">
    <tspan class="dev">  UI/UX</tspan><tspan x="184" class="dim">Figma · Component Design · User Flows · Prototyping</tspan>
  </text>
  <text x="28" y="598" class="base l17">
    <tspan class="dev">  BACKEND</tspan><tspan x="184" class="dim">Python · Flask · SQLAlchemy · SQLite · Supabase</tspan>
  </text>
  <text x="28" y="620" class="base l18">
    <tspan class="dev">  MOBILE</tspan><tspan x="184" class="dim">React Native</tspan>
  </text>
  <text x="28" y="642" class="base l19">
    <tspan class="dev">  DEPLOY</tspan><tspan x="184" class="dim">Vercel · Linux servers</tspan>
  </text>

  <!-- ── ls shipped ── -->
  <text x="28" y="686" class="base l20 cmd" filter="url(#glow)">$ ls ./builds/shipped/</text>

  <text x="28" y="730" class="base l21">
    <tspan class="bld">  FitnessMadness/</tspan><tspan dx="16" class="bld">FireSafe/</tspan>
  </text>
  <text x="28" y="752" class="base l22">
    <tspan class="bld">  GraceyLogistics/</tspan><tspan dx="16" class="bld">Brewed/</tspan>
  </text>

  <!-- ── curl ── -->
  <text x="28" y="796" class="base l23 cmd" filter="url(#glow)">$ curl https://reymartlouie.vercel.app</text>
  <text x="28" y="818" class="base l24">
    <tspan class="dim">  &gt; </tspan><tspan class="ok">200 OK  ✓</tspan>
  </text>

  <!-- ── prompt + cursor ── -->
  <text x="28" y="862" class="base l25 cmd" filter="url(#glow)">$ </text>
  <rect x="44" y="849" width="8" height="16" fill="#7ee787" class="cur"/>
</svg>
